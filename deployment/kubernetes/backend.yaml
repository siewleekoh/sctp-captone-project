apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-api
  namespace: restaurant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restaurant-api
  template:
    metadata:
      labels:
        app: restaurant-api
    spec:
      containers:
        - name: backend-container
          image: public.ecr.aws/u3m8u0c4/ce5-group2-backend:latest
          imagePullPolicy: Always
          env:
            - name: USERNAME
              valueFrom:
                secretKeyRef:
                  name: my-secret
                  key: MYSQL_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_HOST
              value: "ce5-group2-restaurant.c1ak6aeek842.ap-southeast-1.rds.amazonaws.com"
            - name: MYSQL_DATABASE
              value: "db_restaurant"
            - name: MYSQL_PORT
              value: "3306"
            - name: BACKEND_PORT
              value: "8888"
          ports:
            - containerPort: 8888

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: restaurant
  labels:
    app: restaurant-api
spec:
  type: ClusterIP
  selector:
    app: restaurant-api
  ports:
    - name: app-api
      protocol: TCP
      port: 8888
      targetPort: 8888

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-service-monitor
  namespace: monitoring
  labels:
    app: prometheus
    release: prometheus
spec:
  selector:
    matchLabels:
      app: restaurant-api
  endpoints:
    - port: app-api
      interval: 30s
